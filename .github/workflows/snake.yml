name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # alle 12 Stunden
  workflow_dispatch:          # Button "Run workflow" im Actions-Tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # WICHTIG: ohne das schlaegt der Push fehl
    steps:
      - name: Generate snake in neon palette
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=%23ff2ea6&color_dots=%23efe2ff,%23cba6ff,%23a855f7,%237c1fd4,%234c0f8a

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
